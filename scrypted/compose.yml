services:
  scrypted:
    container_name: scrypted
    image: ghcr.io/koush/scrypted:lite
    network_mode: host
    environment:
      TZ: Europe/Oslo
    volumes:
      - ./data:/server/volume
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    security_opt:
      - apparmor:unconfined
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
